name: CI

on:
  push:
    branches: [main, v2-dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm --prefix src ci

      # The Tauri build script needs ../src/dist to exist, and this also type-checks the UI bundle.
      - name: Build frontend
        run: npm --prefix src run build

      # Logic lives in ghost-core, which has no Tauri dependency. The app crate's own test
      # program cannot start on Windows (it needs the Common Controls manifest that only the
      # real app build embeds), so it is compiled here but never run.
      - name: Rust tests
        run: cargo test -p ghost-core --locked

      - name: Compile the app crate
        run: cargo check -p app --locked
