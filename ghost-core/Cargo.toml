[package]
name = "ghost-core"
version = "0.2.1"
description = "Ghost Query logic with no Tauri dependency: history, SQLite, provider client, settings"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util"] }
tokio-util = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
uuid = { version = "1.0", features = ["v4"] }
